<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 27th Birthday</title>
    <meta name="description" content="A digital scrapbook celebrating a special 27th birthday">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Happy 27th Birthday">
    <meta property="og:description" content="A digital scrapbook celebrating a special 27th birthday">
    <meta property="og:image" content="images/Front Page_rene.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Happy 27th Birthday">
    <meta name="twitter:description" content="A digital scrapbook celebrating a special 27th birthday">
    <meta name="twitter:image" content="images/Front Page_rene.jpg">

    <meta name="theme-color" content="#f5f2ed">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scrapbook-container">
        <!-- Book wrapper for 3D perspective -->
        <div class="book">
            <!-- Shadow beneath book for grounding -->
            <div class="book-shadow"></div>

            <!-- Page 1: Cover / Letter-Left -->
            <div class="page" data-page="1">
                <div class="page-front">
                    <div class="page-content cover-page">
                        <span class="cover-label">Happy 27th Birthday</span>
                        <span class="cover-year">2026</span>
                    </div>
                </div>
                <div class="page-back">
                    <div class="page-content spread-left" data-spread="title">
                    </div>
                </div>
            </div>

            <!-- Page 2: Letter-Right / Back Cover Interior -->
            <div class="page" data-page="2">
                <div class="page-front">
                    <div class="page-content spread-right" data-spread="title">
                    </div>
                </div>
                <div class="page-back">
                    <div class="page-content back-cover-interior"></div>
                </div>
            </div>
        </div>

        <!-- Swipe hint -->
        <div class="swipe-hint">
            <span>Swipe or drag to turn pages</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
